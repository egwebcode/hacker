<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>CPF CHECK SYSTEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --neon:#38bdf8;
  --neon2:#a855f7;
  --danger:#fb7185;
}
*{box-sizing:border-box}
body{
  margin: 0;
  height: 100vh;

  background-image: url("https://i.pinimg.com/236x/db/9d/9e/db9d9e5a37c943f0ad4e10bb4435586c.jpg");
  background-size: cover;        /* cobre a tela toda */
  background-position: center;   /* centraliza */
  background-repeat: no-repeat;  /* não repete */
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: system-ui, Segoe UI, Arial;
  color: #fff;
}
.panel{
  width:440px;
  background:rgba(2,6,23,.78);
  backdrop-filter:blur(16px);
  border-radius:18px;
  padding:22px;
  border:1px solid #1e293b;
  box-shadow:
    0 0 35px #38bdf840,
    inset 0 0 30px #000;
  animation:glow 3s ease-in-out infinite
}
@keyframes glow{
  0%,100%{box-shadow:0 0 35px #38bdf840,inset 0 0 30px #000}
  50%{box-shadow:0 0 55px #a855f760,inset 0 0 30px #000}
}
h1{
  text-align:center;
  font-size:17px;
  letter-spacing:3px;
  margin:0 0 16px;
  color:#e0e7ff
}
textarea{
  width:100%;
  height:110px;
  background:#020617;
  border:1px solid #1e293b;
  border-radius:12px;
  padding:12px;
  color:#e5e7eb;
  resize:none;
  outline:none;
  box-shadow:inset 0 0 14px #000
}
textarea::placeholder{color:#64748b}
button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border-radius:12px;
  border:none;
  background:linear-gradient(90deg,var(--neon),var(--neon2));
  color:#fff;
  font-weight:800;
  letter-spacing:1px;
  cursor:pointer;
  box-shadow:0 0 20px #38bdf880
}
button:disabled{opacity:.6;cursor:not-allowed}
.actions{
  display:flex;
  gap:8px;
  margin-top:10px
}
.actions button{
  flex:1;
  font-size:13px;
  padding:9px;
  background:#020617;
  border:1px solid #1e293b;
  box-shadow:none
}
.loading{
  margin:22px auto;
  width:64px;
  height:64px;
  border-radius:50%;
  border:4px solid #1e293b;
  border-top:4px solid var(--neon);
  animation:spin 1s linear infinite;
  display:none
}
@keyframes spin{to{transform:rotate(360deg)}}
pre{
  display:none;
  background:#020617;
  border-radius:12px;
  padding:12px;
  margin-top:12px;
  max-height:260px;
  overflow:auto;
  color:#a5b4fc;
  box-shadow:inset 0 0 14px #000;
  font-size:13px
}
.msg{
  text-align:center;
  margin-top:14px;
  color:var(--danger);
  display:none;
  font-weight:600
}
</style>
</head>

<body>
<div class="panel">
  <h1>CPF VALIDATION SYSTEM</h1>

  <textarea id="cpfs" placeholder="Digite 1 CPF por linha"></textarea>

  <button id="btn" onclick="start()">CONSULTAR</button>

  <div class="loading" id="loading"></div>

  <div class="actions">
    <button onclick="copyJSON()">COPIAR</button>
    <button onclick="downloadJSON()">DOWNLOAD</button>
  </div>

  <div class="msg" id="msg">Nenhuma API retornou dados válidos</div>

  <pre id="out"></pre>
</div>

<script>
const apis=[
 'https://corsproxy.io/?https://bullsbet.bet.br/api/documents/validate',
 'https://corsproxy.io/?https://bateu.bet.br/api/documents/validate',
 'https://corsproxy.io/?https://donald.bet.br/api/documents/validate',
 'https://corsproxy.io/?https://brx.bet.br/api/documents/validate',
 'https://corsproxy.io/?https://play.bet.br/api/documents/validate'
];

let resultados = [];

function cpfValido(cpf){
 cpf=cpf.replace(/\D/g,'');
 if(cpf.length!==11||/^(\d)\1+$/.test(cpf))return false;
 let s=0,r;
 for(let i=1;i<=9;i++)s+=cpf[i-1]*(11-i);
 r=(s*10)%11; if(r==10||r==11)r=0;
 if(r!=cpf[9])return false;
 s=0;
 for(let i=1;i<=10;i++)s+=cpf[i-1]*(12-i);
 r=(s*10)%11; if(r==10||r==11)r=0;
 return r==cpf[10];
}

function ignorar(res){
 if(!res) return true;
 if(res.error === true) return true;
 if(res.success === false &&
    String(res.message||'').toLowerCase().includes('documento')
 ) return true;
 return false;
}

async function consultarCPF(cpf){
 for(const url of apis){
  try{
   const r = await fetch(url,{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({number:cpf,captcha_token:""})
   });
   const j = await r.json();
   if(!ignorar(j)){
     return {cpf,api:url,resposta:j};
   }
  }catch{}
 }
 return null;
}

async function start(){
 const btn=document.getElementById('btn');
 const load=document.getElementById('loading');
 const out=document.getElementById('out');
 const msg=document.getElementById('msg');

 resultados=[];
 out.textContent='';
 out.style.display=msg.style.display='none';
 load.style.display='block';
 btn.disabled=true;

 const cpfs=document.getElementById('cpfs').value
  .split('\n').map(v=>v.trim()).filter(Boolean);

 for(const cpf of cpfs){
  if(!cpfValido(cpf)) continue;

  const res = await consultarCPF(cpf);
  if(res){
    resultados.push(res);
    out.textContent += JSON.stringify(res,null,2)
      + "\n---------------------------\n";
  }
 }

 load.style.display='none';
 btn.disabled=false;

 if(resultados.length){
  out.style.display='block';
 }else{
  msg.style.display='block';
 }
}

function copyJSON(){
 if(!resultados.length) return;
 navigator.clipboard.writeText(
  resultados.map(r=>JSON.stringify(r,null,2)).join('\n---------------------------\n')
 );
}

function downloadJSON(){
 if(!resultados.length) return;
 const blob = new Blob(
  [resultados.map(r=>JSON.stringify(r,null,2)).join('\n---------------------------\n')],
  {type:'application/json'}
 );
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='resultados.json';
 a.click();
}
</script>
</body>
</html>
